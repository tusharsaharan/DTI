plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.attune.attunenative'
version = '0.1.0'

android {
  namespace "app.attune.attunenative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.code.gson:gson:2.8.9'
  testImplementation 'junit:junit:4.13.2'
}
